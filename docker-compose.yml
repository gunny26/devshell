services:

  devshell:
    image: registry.messner.click/gunny26/devshell:latest
    container_name: devshell
    restart: "no"
    # privileged: true
    volumes:
      - ./.bashrc:/home/ubuntu/.bashrc
      - ~/.vim:/home/ubuntu/.vim
      - ~/gits:/home/ubuntu/gits
      - ~/.ssh:/home/ubuntu/.ssh
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    environment:
      TZ: Europe/Vienna
      DISPLAY: ${DISPLAY}
